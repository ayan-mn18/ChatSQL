name: Deploy to EC2 (self-hosted)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Install deps
      - name: Install dependencies
        run: npm ci

      # 4. Create .env file
      - name: Create .env file
        run: |
          echo "${{ secrets.PROD }}" > .env

      # 5. Build project
      - name: Build project
        run: npm run build

      # 6. Restart app with PM2
      - name: Restart PM2 app
        run: |
          echo "🚀 Deploying app..."

          if pm2 describe chatsql > /dev/null 2>&1; then
            echo "🔄 Restarting existing app"
            pm2 restart chatsql
          else
            echo "🆕 Starting new app"
            pm2 start dist/server.js --name chatsql
          fi

          pm2 save
          echo "✅ Deployment successful"